<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e4000f" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 10 10%27%3E%3Crect width=%2710%27 height=%2710%27 fill=%27%23e4000f%27/%3E%3C/svg%3E"
    />
    <title>Offline · Save Point</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 14px;
        color: #111;
        font: 16px/1.55 Rubik, Arial, sans-serif;
        background-color: #e9e8e4;
        background-image: radial-gradient(rgba(17, 17, 17, 0.09) 1px, transparent 1px);
        background-size: 18px 18px;
      }

      .box {
        width: 100%;
        max-width: 480px;
        padding: 28px 22px;
        background: #fbfbf9;
        border: 3px solid #111;
        box-shadow: 8px 8px 0 #111;
        text-align: center;
      }

      .logo {
        display: inline-block;
        padding: 8px 10px;
        background: #e4000f;
        color: #fff;
        border: 3px solid #111;
        font: 700 1rem monospace;
        letter-spacing: 2px;
        text-decoration: none;
      }

      .logo span {
        color: #111;
      }

      .signal {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 6px;
        height: 64px;
        margin: 26px 0 18px;
      }

      .signal i {
        width: 14px;
        border: 3px solid #111;
        background: #fbfbf9;
      }

      .signal i:nth-child(1) {
        height: 25%;
        background: #e4000f;
      }

      .signal i:nth-child(2) {
        height: 50%;
      }

      .signal i:nth-child(3) {
        height: 75%;
      }

      .signal i:nth-child(4) {
        height: 100%;
      }

      h1 {
        margin: 0 0 12px;
        font: 700 1.35rem monospace;
        text-transform: uppercase;
      }

      p {
        margin: 0 0 16px;
      }

      .status {
        display: inline-block;
        padding: 4px 10px;
        border: 2px solid #111;
        background: #e4000f;
        color: #fff;
        font-weight: 700;
      }

      .status.online {
        background: #2e9e4f;
      }

      button {
        display: block;
        width: 100%;
        min-height: 48px;
        margin-top: 8px;
        padding: 12px 18px;
        background: #e4000f;
        color: #fff;
        border: 3px solid #111;
        box-shadow: 4px 4px 0 #111;
        font: 700 0.9rem monospace;
        text-transform: uppercase;
        cursor: pointer;
      }

      button:active {
        transform: translate(3px, 3px);
        box-shadow: 1px 1px 0 #111;
      }

      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .hint {
        margin: 16px 0 0;
        color: #e4000f;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="box">
      <a class="logo" href="./">SAVE<span>POINT</span></a>
      <div class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <h1>You are offline</h1>
      <p>
        This page is not saved on your device yet. Pages and games you opened before still work
        without the internet.
      </p>
      <p class="status" id="status" role="status">Offline</p>
      <button id="retry" type="button">Retry connection</button>
      <p class="hint" id="hint" hidden>Still no connection. Check your Wi-Fi or mobile data.</p>
    </main>
    <script>
      const status = document.getElementById('status');
      const button = document.getElementById('retry');
      const hint = document.getElementById('hint');

      function showStatus() {
        status.textContent = navigator.onLine ? 'Online' : 'Offline';
        status.classList.toggle('online', navigator.onLine);
      }

      async function retry() {
        button.disabled = true;
        button.textContent = 'Checking...';
        hint.hidden = true;
        try {
          await fetch(location.href, { method: 'HEAD', cache: 'no-store' });
          location.reload();
        } catch {
          hint.hidden = false;
          button.disabled = false;
          button.textContent = 'Retry connection';
        }
      }

      navigator.serviceWorker?.getRegistration().then((registration) => {
        if (registration) document.querySelector('.logo').href = registration.scope;
      });

      button.addEventListener('click', retry);
      window.addEventListener('online', showStatus);
      window.addEventListener('offline', showStatus);
      showStatus();
    </script>
  </body>
</html>
